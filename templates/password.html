{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px"><h1>Change Password</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Current password</label><input type="password" name="old" required>
  <label style="margin-top:10px">New password</label><input type="password" name="new" required minlength="6">
  <p><button class="btn">Save</button></p>
</form></div>{% endblock %}
