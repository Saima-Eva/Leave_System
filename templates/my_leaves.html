{% extends "base.html" %}{% block body %}
<h1>My Leave Requests</h1>
<p><a class="btn" href="{{ url_for('apply') }}">+ New Request</a></p>
<div class="tbl"><table>
<tr><th>#</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Status</th></tr>
{% for r in rows %}<tr><td>{{ r.id }}</td><td>{{ r.leave_type }}</td><td>{{ fmt(r.start_date) }}</td>
<td>{{ fmt(r.end_date) }}</td><td>{{ r.leave_days }}</td>
<td><span class="badge {{ status_of(r) }}">{{ status_of(r) }}</span></td></tr>
{% else %}<tr><td colspan="6">There are no requests.</td></tr>{% endfor %}
</table></div>{% endblock %}
